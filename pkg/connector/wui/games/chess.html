<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Chinese Chess</title>
<style>
  /* ===== wui 主题变量（从 web/ui/src/index.css 摘录，light/dark 同名切换）===== */
  :root, [data-theme="dark"] {
    --color-bg: rgb(4 6 12);
    --color-ink2: #0C1018;
    --color-ink3: #121826;
    --color-t1: #E8ECF4;
    --color-t2: #8A93A6;
    --color-t3: #4A5266;
    --color-green: #3DD68C;
    --color-red: #FF5C5C;
    --color-blue: #00B4FF;
    --color-amber: #FFB547;
    --color-hairline: rgba(120, 180, 255, 0.08);
    /* 棋盘专属：基于主题色派生 */
    --board-bg: #121826;
    --board-edge: #2A3648;
    --grid-line: #3A4A60;
    --last-move: rgba(86, 156, 255, 0.30);
    --grid-line-strong: #4A5C74;
    --river-mark: rgba(138, 147, 166, 0.28);
    --piece-red-bg: #C73E3E;
    --piece-red-edge: #7A2222;
    --piece-red-text: #FFF0EC;
    --piece-black-bg: #E8ECF4;
    --piece-black-edge: #4A5266;
    --piece-black-text: #1A2230;
    --bubble-gbot-bg: rgba(0, 180, 255, 0.12);
    --bubble-gbot-bd: rgba(0, 180, 255, 0.35);
    --bubble-user-bg: rgba(255, 92, 92, 0.10);
    --bubble-user-bd: rgba(255, 92, 92, 0.30);
    --btn-bg: #1A2230;
  }
  [data-theme="light"] {
    --color-bg: #FAFAFA;
    --color-ink2: #F0F0F0;
    --color-ink3: #E5E5E5;
    --color-t1: #111111;
    --color-t2: #666666;
    --color-t3: #999999;
    --color-blue: #333333;
    --color-red: #D54F4F;
    --color-hairline: rgba(0, 0, 0, 0.08);
    --board-bg: #F0EDE6;
    --board-edge: #D8D2C6;
    --grid-line: #B8AE9C;
    --last-move: rgba(230, 160, 40, 0.35);
    --grid-line-strong: #9A8F7A;
    --river-mark: rgba(140, 128, 105, 0.45);
    --piece-red-bg: #D54F4F;
    --piece-red-edge: #A03030;
    --piece-red-text: #FFF5F2;
    --piece-black-bg: #FDFDFD;
    --piece-black-edge: #6A6456;
    --piece-black-text: #2A2620;
    --bubble-gbot-bg: rgba(40, 90, 160, 0.10);
    --bubble-gbot-bd: rgba(40, 90, 160, 0.30);
    --bubble-user-bg: rgba(213, 79, 79, 0.08);
    --bubble-user-bd: rgba(213, 79, 79, 0.28);
    --btn-bg: #FFFFFF;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background: var(--color-bg);
    color: var(--color-t1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ===== 页面主体：整页即棋局（wui 的 artifact-sheet 负责外层容器） ===== */
  #sheet {
    height: 100%;
    background: var(--color-ink2);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .game-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px 10px;
    flex-shrink: 0;
  }
  .game-title { font-size: 15px; font-weight: 600; letter-spacing: .5px; }
  .game-sub { font-size: 12px; color: var(--color-t2); margin-top: 2px; }

  /* ===== 棋盘 ===== */
  .board-wrap {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 12px 8px;
    min-height: 0;
    position: relative;
  }
  svg.board { width: auto; height: 100%; max-width: 100%; display: block; }

  .cell { cursor: pointer; }
  .dot {
    fill: color-mix(in srgb, var(--color-blue) 60%, transparent);
    transition: transform .12s;
    transform-origin: center;
    transform-box: fill-box;
  }
  .cell:hover .dot { transform: scale(1.25); }

  .piece { cursor: grab; }
  .piece circle.body { transition: transform .25s cubic-bezier(.3,.9,.4,1.2); }
  .piece text {
    font-family: "Kaiti SC", "STKaiti", "KaiTi", serif;
    font-weight: 700;
    user-select: none;
    pointer-events: none;
  }

  /* 等待黑方应手/对局结束：整块禁点，防止用户在 gbot 思考时抢先落子 */
  .board-wrap.no-click { pointer-events: none; opacity: .75; }

  /* ===== 对话气泡浮层 ===== */
  .piece.in-check circle.body {
    stroke: var(--color-red);
    stroke-width: 2.5;
    animation: check-pulse 1s ease-in-out infinite;
  }
  @keyframes check-pulse {
    50% { stroke-opacity: .35; }
  }

  .cap-tray {
    min-height: 24px; display: flex; flex-wrap: wrap; align-items: center;
    gap: 3px; padding: 2px 6px;
  }
  #capTop { justify-content: flex-end; }
  #capBottom { justify-content: flex-start; }
  .cap-tray:empty { min-height: 8px; }

  #bubbles {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 28vh;
    overflow-y: auto;
    padding: 8px 2px;
  }
  .bubble {
    align-self: flex-start;
    max-width: 72%;
    padding: 6px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.4;
    opacity: 0;
    transform: translateY(-6px);
    animation: bubble-in .25s ease forwards;
    backdrop-filter: blur(6px);
  }
  .bubble .think-fold {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--color-t3);
    cursor: pointer;
    user-select: none;
    padding: 1px 0;
  }
  .bubble .think-fold svg { transition: transform .15s ease; flex-shrink: 0; }
  .bubble .think-fold svg.open { transform: rotate(90deg); }
  .bubble .think-fold:empty { display: none; }
  .bubble .think {
    font-size: 12px;
    color: var(--color-t3);
    max-height: 7em;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }
  .bubble .think.folded { display: none; }
  .bubble.gbot {
    background: var(--bubble-gbot-bg);
    border: 1px solid var(--bubble-gbot-bd);
    align-self: flex-end;
  }
  .bubble.user {
    background: var(--bubble-user-bg);
    border: 1px solid var(--bubble-user-bd);
  }
  .bubble .who { font-size: 10px; opacity: .65; margin-bottom: 1px; }
  @keyframes bubble-in { to { opacity: 1; transform: translateY(0); } }
  /* pending：黑方思考中，不参与自动淡出，应手后显式移除 */
  .bubble.pending { animation: bubble-in .25s ease forwards; }
  /* error：含重试按钮，容器 pointer-events:none 会吞掉点击，必须单独放开 */
  .bubble.error {
    animation: bubble-in .25s ease forwards;
    background: var(--bubble-user-bg);
    border: 1px solid var(--bubble-user-bd);
    pointer-events: auto;
  }
  .retry-btn {
    margin-top: 5px;
    padding: 3px 14px;
    border-radius: 999px;
    border: 1px solid var(--bubble-gbot-bd);
    background: var(--btn-bg);
    color: var(--color-t1);
    font-size: 12px;
    cursor: pointer;
  }

  /* ===== 操作条 ===== */
  .controls {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    padding: 8px 16px calc(10px + env(safe-area-inset-bottom, 0px));
    flex-shrink: 0;
  }
  /* End-of-game primary CTA (lichess convention: solid filled for the main
     action, outlined only for secondary). Uses the red-general disc color —
     on-theme on both light and dark. */
  .btn-primary {
    padding: 9px 22px;
    border: none; border-radius: 10px;
    background: #D54F4F; color: #FFF5F2;
    font-size: 13px; font-weight: 600; letter-spacing: .5px;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(213, 79, 79, .35);
    transition: filter .15s ease, transform .1s ease;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: scale(.97); }
  .icon-btn {
    width: 32px; height: 32px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; line-height: 1;
    border-radius: 50%;
    border: 1px solid var(--grid-line);
    background: var(--btn-bg);
    color: var(--color-t3);
    cursor: pointer;
    transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--color-red); border-color: var(--color-red); }
  .icon-btn.confirm { color: var(--color-red); border-color: var(--color-red); background: color-mix(in srgb, var(--color-red) 12%, transparent); }
  .btn {
    flex: 1;
    max-width: 120px;
    padding: 9px 0;
    border-radius: 999px;
    border: 1px solid var(--grid-line);
    background: var(--btn-bg);
    color: var(--color-t2);
    font-size: 13px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:active { background: var(--color-ink3); }
  .btn.warn { border-color: color-mix(in srgb, var(--color-red) 40%, transparent); color: var(--color-red); }
  /* Lichess-style result bar: never covers the board — players want to
     review the final position; a blocking modal is the most-complained-about
     end-of-game pattern on chess.com. Slim bar below the board. */
  #resultBanner {
    display: none; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 16px; border-radius: 12px;
    background: color-mix(in srgb, var(--color-bg) 92%, var(--grid-line));
    border: 1px solid var(--grid-line);
    border-left: 4px solid var(--result-accent, var(--grid-line));
    animation: result-in .3s ease;
  }
  @keyframes result-in {
    from { opacity: 0; transform: translateY(8px); }
  }
  #resultText {
    font-size: 15px; font-weight: 700; color: var(--color-t1); letter-spacing: .5px;
  }
</style>
</head>
<body>

<div id="sheet">
  <div class="game-header">
    <div>
    </div>
    <div style="display:flex;align-items:center">
    </div>
  </div>

  <div id="bubbles"></div>

  <div id="capTop" class="cap-tray"></div>
  <div class="board-wrap" id="boardWrap">
    <svg class="board" viewBox="0 0 460 512" id="board"></svg>
  </div>

  <div id="capBottom" class="cap-tray"></div>

  <div id="resultBanner">
    <div id="resultText"></div>
    <button class="btn-primary" onclick="ChessGame.newGame()">再来一局</button>
  </div>

  <div class="controls">
    <button id="resignBtn" class="icon-btn" title="认输" onclick="ChessGame.resign()">🏳</button>
  </div>
</div>

<script id="game-code">
(function () {
  'use strict';

  const OBSERVE_PROMPT = `你是一位征战多年的中国象棋老棋手，棋风稳健老辣，现执黑与用户（红）对弈。
用户消息为当前局面观察，包含：
1. ASCII 棋盘：每格一个字母。小写 r n b a c k p = 你的黑子（車馬象仕将砲卒），大写 R N B A C K P = 对方的红子（车马相士帅炮兵），. 为空格。顶行 y0 是你的底线，底行 y9 是红方底线。
2. 「你的棋子」「对方棋子」：双方每个子的名称与坐标 (x,y)。
3. 「上一步」：红方刚走的着法（标准中文记谱）。
4. 对局记录中你的笔记 = 计划存档;「要点情报」:对方将门守备与你占中路/肋线的大子。
5. 「legal-moves:」之后的行：你当前所有合法走法（标准中文记谱，每行一条）。
6. 「受威胁的你的棋子」：对方下一手就能吃掉的你的子及其「可救着法」（记谱 token，直接选用即可,优先救价值最大的子）。
7. 「步法评估」：引擎对每个合法步的一步前瞻 — 安全（落子后不会被吃）、会被X吃（勿走，除非换子划算）、可吃Y（能吃对方Y）。
8. 「局面要素」：双方子力总值、已出动大子数、过河子数、活动度（合法步数）— 战略决策的依据。
子力价值: 車=9 馬=4.5 砲=4.5 卒=1(过河后2) 象/仕=2
选子程序（严格按序执行）:
1. 净亏检查: 若「受威胁」中被捉子的价值,大于你本步能安全吃到的子,且无法吃回攻击者——先从该子的「可救着法」中选一步。
2. 否则,在「安全·有吃子」行的步法里(标注(吃X)),选吃的子价值最大的一步。
3. 否则,按阶段走战略(参照「局面要素」与历史手数):
   - 开局(前12手): 出动车马炮大子,抢占卒林线与要道,马跳河口,炮占中路;忌反复动同一子、忌拥塞。
   - 中局: 提高活动度劣势项,大子过河协同作战,控制中路;有攻势时敢于弃子攻杀。
   - 残局: 兵贵神速,将帅助攻,占位争先。
4. 绝不选「有代价」行中标(会致杀:…)的步法;标注(绝杀!)的步法必走。
5. 禁选标(会被X吃)的步法,除非可吃子价值明显大于将被吃的子。
杀法与防守常识(识别对方杀形是活命关键):
- 常见杀形: 马后炮(马控将门+炮后将军)、重炮/叠炮(双炮同线前将后架)、双车错、卧槽马、钓鱼马、天地炮(一中炮一底线炮)、铁门栓、闷宫、空头炮。
- 防守要诀: 士象勿拆(将门屏障)、炮架勿轻让(对方重炮常借你自己的子作架)、将门前的自家子是双刃剑、车路保持通畅、被将军时优先垫子或吃回而非盲逃。
- 进攻要诀: 控住对方将门与中路,先困将后绝杀;弃子引士象常是入杀前奏。
对局记录中"—"后是你的历史笔记,即你的作战计划存档(scratchpad):不可改写,只能在新笔记中声明【延续】【修订】或【废除】。
每手笔记必须用计划语法(口语化中文,展示给用户):
【形势】第一词必须是形势判断:我优/均势/我劣,随后一条证据(参照「局面要素」),再述对方布局与意图
【计划】类型·目标(手数) — 从计划菜单选择,含【延续/修订/废除】声明
【进度】n/m,计划到期未达必须修订
计划菜单与选择判据: 攻杀类—沉底炮+马后炮/双车错占肋/铁门栓控中路(选于:你攻势或子力占优、或被迫搏斗时); 破局类—兑子消势/弃子抢先/封锁要道(选于:对方攻势猛时); 简化类—兑子入残局(选于:对方将门稳而你子力领先时); 固守类—补士象固防待变(选于:你将门欠固或受威胁清单非空时)。
硬约束: 连续两手不得移动同一棋子(解将、吃子、执行计划必需除外);开局严禁连走仕象。
你的回复必须满足（先想后走，最后一行必须是单独一行的着法 token——缺了这行回复无效）：
- 先写计划语法笔记(【形势】【计划】【进度】各占一行)。
- 最后一行是着法：从 legal-moves 清单中逐字符原样复制一条（不得改写、增删空格或翻译数字）。
【格式示例】
【形势】我劣 红中炮过河车急攻我左翼,对方将门仕1相2欠固是唯一机会
【计划】破局·兑子消势(3手):車8进3兑中路车,消其炮势【新立】
【进度】0/3
車8进3
- 开局阶段（前12手）从正统布局行棋：对当头炮应以屏风马、反宫马、顺炮或列炮，按谱走，不即兴创新。
- 「受威胁」中出现你的将被捉且可救着法为「无」时 = 败局已定，最后一行只写：认输
- 只有被将死不可避免、或子力差距超过一车且毫无攻势时才认输（少一两个子必须继续顽抗，象棋残局常有翻盘）；认输时最后一行只写：认输
- 除以上内容外不要输出任何其他文字、JSON 或 markdown 代码块。`;

  const COLS = 9, ROWS = 10;
  const CELL = 48, PAD = 16;
  const CN_NUM = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
  // For straight-line pieces the trailing digit is a step count; for ma/xiang/shi it is the target column.
  // Charset matches the lib's exportTextBoard exactly (red uses 士, black 仕 — the reverse of
  // tradition; do not swap).
  const STRAIGHT = new Set(['車', '车', '炮', '砲', '兵', '卒', '帅', '将']);

  const boardSvg = document.getElementById('board');
  const boardWrap = document.getElementById('boardWrap');

  const game = new ZhChess.default({});

  // Construction gate: gameState starts at 'INIT' where update/moveStr reject
  // everything; only gameStart flips it to START, and gameStart resets the board
  // via initPiece — so any setPenCodeList/replay must come after it.
  game.gameStart('RED');

  // moveEvents fires per applied move; the third arg is true when the move
  // checks the enemy (or mates) — the only cheap check signal the lib offers.
  let checkSide = null;
  game.moveEvents.push((piece, _cp, trouble) => {
    checkSide = trouble ? (piece.side === 'RED' ? 'BLACK' : 'RED') : null;
  });

  // Captured trays need the initial piece multiset. Collected from the fresh
  // board at startup instead of hardcoded: this lib's piece glyphs defy
  // tradition (red 士 vs black 仕), and a wrong guess shows phantom captures.
  const START_COUNTS = { RED: {}, BLACK: {} };
  for (const p of game.currentLivePieceList)
    START_COUNTS[p.side][p.name] = (START_COUNTS[p.side][p.name] || 0) + 1;

  let selected = null;      // currently selected red piece {r, c}
  let pending = false;      // black is thinking (clicks locked)
  let gameOver = false;
  let moves = [];           // completed half-moves in notation, always even (red/black)
  let notes = [];           // black's note per black half-move — the scratchpad
  let pendingRedToken = ''; // 红步刚落的记谱，等黑步应答成功后与黑 token 一起入档
  let lastNote = '';        // 黑方上一手附言（仅本页会话内有效，刷新即失）
  let lastCaptured = '';    // 最近一手被吃的子名（空串 = 无吃子）

  // ---- archive ----
  const saveKey = () => 'chess-save:' + location.pathname;

  function loadSave() {
    try {
      const raw = localStorage.getItem(saveKey());
      if (!raw) return null;
      const obj = JSON.parse(raw);
      if (!obj || (obj.v !== 1 && obj.v !== 2) || !Array.isArray(obj.moves)) return null;
      // Odd length = red moved but black never answered; restoring would drop
      // black's reply, so treat as corrupt.
      if (obj.moves.length % 2 !== 0) return null;
      if (!obj.moves.every(m => typeof m === 'string')) return null;
      const savedNotes = obj.v === 2 && Array.isArray(obj.notes)
        ? obj.notes.filter(n => typeof n === 'string') : [];
      while (savedNotes.length < obj.moves.length / 2) savedNotes.push('');
      return { moves: obj.moves, notes: savedNotes.slice(0, obj.moves.length / 2) };
    } catch (e) {
      return null;
    }
  }

  function saveMoves() {
    localStorage.setItem(saveKey(), JSON.stringify({ v: 2, moves, notes }));
  }

  function discardSave() {
    localStorage.removeItem(saveKey());
  }

  // ---- notation (standard Chinese: red uses hanzi digits, black arabic) ----
  function colName(side, x) {
    const n = side === 'RED' ? x + 1 : 9 - x;
    return side === 'RED' ? CN_NUM[n - 1] : String(n);
  }

  function prefixFor(piece, side, piecesOfSide) {
    const sameCol = piecesOfSide.filter(q => q.name === piece.name && q.x === piece.x);
    const n = sameCol.length;
    if (n < 2) return '';
    // qian/hou follow the advance direction: red has smaller y in front, black larger.
    const sorted = sameCol.slice().sort((a, b) => (side === 'RED' ? a.y - b.y : b.y - a.y));
    const idx = sorted.indexOf(piece);
    if (n === 2) return idx === 0 ? '前' : '后';
    if (n === 3) return ['前', '中', '后'][idx];
    if (idx === 0) return '前';
    if (idx === n - 1) return '后';
    return CN_NUM[idx];
  }

  function moveToNotation(move, side, piecesOfSide) {
    const piece = piecesOfSide.find(p => p.x === move.from.x && p.y === move.from.y);
    const prefix = prefixFor(piece, side, piecesOfSide);
    const colFrom = colName(side, move.from.x);
    const colTo = colName(side, move.to.x);
    let action, tail;
    if (move.to.y === move.from.y) {
      action = '平';
      tail = colTo;
    } else {
      const forward = side === 'RED' ? move.to.y < move.from.y : move.to.y > move.from.y;
      action = forward ? '进' : '退';
      const steps = Math.abs(move.to.y - move.from.y);
      tail = STRAIGHT.has(piece.name)
        ? (side === 'RED' ? CN_NUM[steps - 1] : String(steps))
        : colTo;
    }
    // Standard notation: stacked-piece prefixes (qian/zhong/hou) REPLACE the column
    // digit — "前兵进一", not "前兵五进一" — matching LLM training corpora lowers
    // the chance the model's copied token is judged illegal.
    return prefix + piece.name + (prefix ? '' : colFrom) + action + tail;
  }

  function legalNotations(side) {
    const pieces = game.getPiecesOfSide(side);
    return game.generateLegalMoves(side).map(m => moveToNotation(m, side, pieces));
  }

  // token → exact Move match, then apply; returns the Move (with captured) or null.
  function applyToken(token, side) {
    const pieces = game.getPiecesOfSide(side);
    const move = game.generateLegalMoves(side)
      .find(m => moveToNotation(m, side, pieces) === token);
    if (!move) return null;
    const r = game.update(
      { x: move.from.x, y: move.from.y },
      { x: move.to.x, y: move.to.y },
      side, true,
    );
    if (!r.flag) return null;
    return move;
  }

  // ---- board rendering (prototype drawBoard skin, data from zh-chess) ----
  function px(c) { return PAD + c * CELL + CELL / 2; }
  function py(r) { return PAD + r * CELL + CELL / 2; }

  // Captured trays follow the trophy convention (lichess-style): each side
  // shows the pieces IT captured — the user's black trophies at the bottom,
  // the opponent's red trophies on top.
  // Tray pieces are mini versions of the board piece (same palette vars and
  // Kaiti glyph), so a captured horse looks exactly like the horse on board.
  function miniPieceSVG(name, side) {
    const red = side === 'RED';
    return `<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">` +
      `<circle cx="12" cy="12" r="10.5" fill="${red ? 'var(--piece-red-bg)' : 'var(--piece-black-bg)'}" stroke="${red ? 'var(--piece-red-edge)' : 'var(--piece-black-edge)'}" stroke-width="1.2"/>` +
      `<circle cx="12" cy="12" r="8.75" fill="none" stroke="${red ? 'rgba(255,255,255,.3)' : 'var(--piece-black-edge)'}" stroke-width="0.6" opacity="0.5"/>` +
      `<text x="12" y="15.5" text-anchor="middle" font-size="10" font-weight="700" fill="${red ? 'var(--piece-red-text)' : 'var(--piece-black-text)'}" font-family='"Kaiti SC","STKaiti","KaiTi",serif'>${name}</text></svg>`;
  }

  function renderCaptured() {
    const have = { RED: {}, BLACK: {} };
    for (const p of game.currentLivePieceList)
      have[p.side][p.name] = (have[p.side][p.name] || 0) + 1;
    const lost = (side) => {
      const out = [];
      for (const [name, n] of Object.entries(START_COUNTS[side])) {
        const d = n - (have[side][name] || 0);
        for (let i = 0; i < d; i++) out.push(name);
      }
      return out;
    };
    document.getElementById('capTop').innerHTML = lost('RED').map((n) => miniPieceSVG(n, 'RED')).join('');
    document.getElementById('capBottom').innerHTML = lost('BLACK').map((n) => miniPieceSVG(n, 'BLACK')).join('');
  }

  function renderBoard() {
    const ns = 'http://www.w3.org/2000/svg';
    const mk = (tag, attrs) => {
      const el = document.createElementNS(ns, tag);
      for (const k in attrs) el.setAttribute(k, attrs[k]);
      return el;
    };

    boardSvg.innerHTML = '';

    boardSvg.appendChild(mk('rect', { x: 2, y: 2, width: 456, height: 508, rx: 14,
      fill: 'var(--board-bg)', stroke: 'var(--board-edge)', 'stroke-width': 1.5 }));

    for (let c = 0; c < COLS; c++) {
      if (c === 0 || c === COLS - 1) {
        boardSvg.appendChild(mk('line', { x1: px(c), y1: py(0), x2: px(c), y2: py(ROWS-1),
          stroke: 'var(--grid-line-strong)', 'stroke-width': 1.2 }));
      } else {
        boardSvg.appendChild(mk('line', { x1: px(c), y1: py(0), x2: px(c), y2: py(4),
          stroke: 'var(--grid-line-strong)', 'stroke-width': 1.2 }));
        boardSvg.appendChild(mk('line', { x1: px(c), y1: py(5), x2: px(c), y2: py(ROWS-1),
          stroke: 'var(--grid-line-strong)', 'stroke-width': 1.2 }));
      }
    }
    for (let r = 0; r < ROWS; r++) {
      boardSvg.appendChild(mk('line', { x1: px(0), y1: py(r), x2: px(COLS-1), y2: py(r),
        stroke: 'var(--grid-line-strong)', 'stroke-width': 1.2 }));
    }

    for (const [x1,y1,x2,y2] of [
      [px(3),py(0),px(5),py(2)], [px(5),py(0),px(3),py(2)],
      [px(3),py(7),px(5),py(9)], [px(5),py(7),px(3),py(9)],
    ]) boardSvg.appendChild(mk('line', { x1,y1,x2,y2, stroke: 'var(--grid-line-strong)', 'stroke-width': 1.2 }));

    const riverY = py(4) + CELL / 2 + 8;
    const mkRiver = (text, anchor, x) => {
      const t = mk('text', { x, y: riverY, 'text-anchor': anchor,
        fill: 'var(--river-mark)', 'font-size': 24, 'letter-spacing': 8,
        'font-family': '"Kaiti SC","STKaiti","KaiTi",serif', 'font-weight': 700 });
      t.textContent = text;
      boardSvg.appendChild(t);
    };
    mkRiver('楚 河', 'start', px(0) + 14);
    mkRiver('汉 界', 'end', px(COLS-1) - 14);

    const marks = [[1,2],[7,2],[1,7],[7,7],[0,3],[2,3],[4,3],[6,3],[8,3],[0,6],[2,6],[4,6],[6,6],[8,6]];
    for (const [c,r] of marks) {
      const s = 4, gap = 3, x = px(c), y = py(r);
      for (const [sx,sy] of [[-1,-1],[1,-1],[-1,1],[1,1]]) {
        const cx = x + sx * (gap + s), cy = y + sy * (gap + s);
        if (c === 0 && sx < 0) continue;
        if (c === COLS-1 && sx > 0) continue;
        boardSvg.appendChild(mk('path', {
          d: `M ${cx - s*sx} ${cy} L ${cx} ${cy} L ${cx} ${cy - s*sy}`,
          stroke: 'var(--grid-line)', 'stroke-width': 1.3, fill: 'none' }));
      }
    }

    const selLegal = selected
      ? game.generateLegalMoves('RED')
          .filter(m => m.from.x === selected.c && m.from.y === selected.r)
      : [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const cell = mk('rect', { x: px(c)-CELL/2, y: py(r)-CELL/2, width: CELL, height: CELL,
        fill: 'transparent', class: 'cell', 'data-r': r, 'data-c': c });
      cell.addEventListener('click', onCellClick);
      boardSvg.appendChild(cell);
      if (selLegal.some(m => m.to.x === c && m.to.y === r)) {
        boardSvg.appendChild(mk('circle', { cx: px(c), cy: py(r), r: 6, class: 'dot' }));
      }
    }

    for (const p of game.currentLivePieceList) {
      const side = p.side === 'RED' ? 'red' : 'black';
      const g = mk('g', { class: 'piece ' + side + ((p.side === checkSide && (p.name === '帅' || p.name === '将')) ? ' in-check' : ''),
        transform: `translate(${px(p.x)},${py(p.y)})`, 'data-r': p.y, 'data-c': p.x });
      if (p.isLastMove) g.appendChild(mk('rect', { x: -24, y: -24, width: 48, height: 48,
        fill: 'var(--last-move)', class: 'last-move' }));
      g.appendChild(mk('circle', { r: 21,
        fill: side==='red' ? 'var(--piece-red-bg)' : 'var(--piece-black-bg)',
        stroke: side==='red' ? 'var(--piece-red-edge)' : 'var(--piece-black-edge)',
        'stroke-width': 1.5, class: 'body' }));
      g.appendChild(mk('circle', { r: 17.5, fill: 'none',
        stroke: side==='red' ? 'rgba(255,255,255,.3)' : 'var(--piece-black-edge)',
        'stroke-width': 1, opacity: .5 }));
      const t = mk('text', { 'text-anchor': 'middle', y: 7, 'font-size': 21,
        fill: side==='red' ? 'var(--piece-red-text)' : 'var(--piece-black-text)' });
      t.textContent = p.name;
      g.appendChild(t);
      g.addEventListener('click', e => { e.stopPropagation(); onCellClick({currentTarget: g}); });
      boardSvg.appendChild(g);
    }
    renderCaptured();
  }

  // ---- interaction ----
  function onCellClick(e) {
    if (pending || gameOver) return;
    const el = e.currentTarget;
    const r = +el.getAttribute('data-r'), c = +el.getAttribute('data-c');
    if (selected) {
      const pieces = game.getPiecesOfSide('RED');
      const move = game.generateLegalMoves('RED').find(m =>
        m.from.x === selected.c && m.from.y === selected.r &&
        m.to.x === c && m.to.y === r);
      if (move) {
        pendingRedToken = moveToNotation(move, 'RED', pieces);
        lastCaptured = move.captured ? move.captured.name : '';
        game.update({ x: move.from.x, y: move.from.y },
          { x: move.to.x, y: move.to.y }, 'RED', true);
        selected = null;
        renderBoard();
        // A mate/stalemate against black sets OVER inside update — end locally,
        // no observer round-trip. A captured general bypasses the lib's check
        // logic entirely (nothing left to be "in check"), so test absence too.
        const blackKingGone = !game.currentLivePieceList.some(p => p.name === '将');
        if (game.gameState === 'OVER' || blackKingGone) {
          gameOver = true;
          bubble('gbot', blackKingGone ? '老将被擒，这局你赢了。' : '你赢了！我被将死，无路可走。');
          showResult('你赢了');
          return;
        }
        postTurn();
        return;
      }
    }
    const hit = game.currentLivePieceList.find(p => p.x === c && p.y === r);
    selected = hit && hit.side === 'RED' ? { r, c } : null;
    renderBoard();
  }

  // ---- observation text (cache-friendly: stable prefix first, volatile tail) ----
  // Built only when red has moved and black must answer (inside postTurn), always
  // from black's perspective: the legal list must be black's moves so a model-
  // chosen token can be applied via applyToken(…,'BLACK'). moves pairs up only
  // after black answers; at render time red's hand sits in pendingRedToken, so
  // black is about to play move number moves.length+2 (red took +1).
  // Xiangqi-FEN letters — same convention as the engine world and our PEN
  // string (lowercase = black, uppercase = red). Case-as-side is the cue
  // LLMs know cold from international-chess corpora; the traditional/simplified
  // glyph split (車 vs 车) proved unreadable to models.
  // Lib glyph reality (verified twice by runtime enumeration): BLACK is
  // 車馬象仕将砲卒, RED is 车马相士帅炮兵 — do not "correct" to tradition.
  const FEN_LETTER = {
    BLACK: { '車': 'r', '馬': 'n', '象': 'b', '仕': 'a', '将': 'k', '砲': 'c', '卒': 'p' },
    RED: { '车': 'R', '马': 'N', '相': 'B', '士': 'A', '帅': 'K', '炮': 'C', '兵': 'P' },
  };

  function asciiBoardLines() {
    const grid = Array.from({ length: ROWS }, () => Array(COLS).fill('.'));
    for (const p of game.currentLivePieceList)
      grid[p.y][p.x] = FEN_LETTER[p.side][p.name];
    const lines = ['     x0 x1 x2 x3 x4 x5 x6 x7 x8'];
    for (let y = 0; y < ROWS; y++)
      lines.push(`y${y}  ` + grid[y].join('  '));
    return lines;
  }

  function sideInventory(side) {
    const inv = [];
    for (const p of game.currentLivePieceList)
      if (p.side === side) inv.push(`${p.name}(${p.x},${p.y})`);
    return inv.join(' ');
  }

  // One-step lookahead per legal move — the "external planning" lever:
  // engine-computed safety beats any prompt plea. Apply each move, list
  // red's captures that target the moved piece, restore from the PEN
  // snapshot (which also restores the side to move).
  // Two-ply mate sweep: mate-in-1 both ways. [绝杀] marks our immediate
  // mating moves; [会致杀] marks moves that hand red a mate-in-1 (the
  // double-cannon screen-lift blunder class). Prefilter red replies to
  // captures and palace/file-4 landings — where virtually all frontal mates
  // come from — to keep the sweep fast.
  function mateSweep(m) {
    // setPenCodeList restores pieces and side but NOT gameState — an OVER
    // set by a simulated mate must be reverted or the real game freezes
    // ("棋盘结束 等待重开" rejects every later update).
    const st = game.gameState;
    game.update({ x: m.from.x, y: m.from.y }, { x: m.to.x, y: m.to.y }, 'BLACK', true);
    const afterUs = ZhChess.gen_PEN_Str(game.currentLivePieceList, 'RED');
    let ourMate = game.generateLegalMoves('RED').length === 0;
    let deadly = false;
    let killer = '';
    game.gameState = st;
    if (!ourMate) {
      const redPieces = game.getPiecesOfSide('RED');
      for (const r of game.generateLegalMoves('RED')) {
        const frontal = (r.to.x >= 3 && r.to.x <= 5) || r.captured;
        if (!frontal) continue;
        game.update({ x: r.from.x, y: r.from.y }, { x: r.to.x, y: r.to.y }, 'RED', true);
        if (game.gameState === 'OVER') {
          deadly = true;
          // Serialize the killer line (MATE: readable variations beat opaque
          // tags — models skip bare labels but read concrete sequences).
          killer = '红' + moveToNotation(r, 'RED', redPieces) + '绝杀';
        }
        game.setPenCodeList(afterUs);
        game.gameState = st;
        if (deadly) break;
      }
    }
    return { ourMate, deadly, killer };
  }

  function moveEvalLine() {
    const st = game.gameState;
    const pen = ZhChess.gen_PEN_Str(game.currentLivePieceList, 'BLACK');
    const pieces = game.getPiecesOfSide('BLACK');
    const moves = game.generateLegalMoves('BLACK');
    const caps = [], safe = [], risky = [];
    for (const m of moves) {
      const token = moveToNotation(m, 'BLACK', pieces);
      let hunterTag = '';
      game.update({ x: m.from.x, y: m.from.y }, { x: m.to.x, y: m.to.y }, 'BLACK', true);
      const hunters = game.generateLegalMoves('RED')
        .filter(r => r.captured && r.captured.x === m.to.x && r.captured.y === m.to.y);
      if (hunters.length > 0) {
        const hunterName = game.getPiecesOfSide('RED')
          .find(p => p.x === hunters[0].from.x && p.y === hunters[0].from.y);
        hunterTag = '会被' + (hunterName ? hunterName.name : '?') + '吃';
      }
      game.setPenCodeList(pen);
      game.gameState = st;
      const { ourMate, deadly, killer } = mateSweep(m);
      game.setPenCodeList(pen);
      game.gameState = st;
      if (ourMate) { caps.push(`${token}(绝杀!)`); continue; }
      if (deadly) { risky.push(`${token}(会致杀:则${killer})`); continue; }
      if (m.captured && !hunterTag) caps.push(`${token}(吃${m.captured.name})`);
      else if (m.captured) risky.push(`${token}(吃${m.captured.name}·${hunterTag})`);
      else if (hunterTag) risky.push(`${token}(${hunterTag})`);
      else safe.push(token);
    }
    // Categorized so each decision step scans exactly one line; captures
    // lead because a safe capture is the default best move. A flat list
    // buried the captures and the model played meaningless moves instead.
    return '步法评估:\n- 安全·有吃子: ' + (caps.join(' ') || '无') +
      '\n- 安全: ' + (safe.join(' ') || '无') +
      '\n- 有代价: ' + (risky.join(' ') || '无');
  }

  // Positional metrics the engine computes for free — the strategy layer
  // material/tactics alone cannot express: development, river presence,
  // mobility. "Amateurs optimize the next move, masters the position."
  const PIECE_VALUE = { '車': 9, '馬': 4.5, '砲': 4.5, '卒': 1, '象': 2, '仕': 2, '将': 0,
                        '车': 9, '马': 4.5, '炮': 4.5, '兵': 1, '相': 2, '士': 2, '帅': 0 };
  function situationLine() {
    const stats = { RED: { mat: 0, dev: 0, river: 0 }, BLACK: { mat: 0, dev: 0, river: 0 } };
    for (const p of game.currentLivePieceList) {
      const s = stats[p.side];
      s.mat += PIECE_VALUE[p.name] || 0;
      // Proxy metric: big pieces off their STARTING squares count as
      // developed — a piece returning home reads as undeveloped. Cheap and
      // directionally right; not an exact activity measure.
      const bigStart = (p.name === '車' && p.y === 0) || (p.name === '馬' && p.y === 0) || (p.name === '砲' && p.y === 2) ||
                       (p.name === '车' && p.y === 9) || (p.name === '马' && p.y === 9) || (p.name === '炮' && p.y === 7);
      if (['車','馬','砲','车','马','炮'].includes(p.name) && !bigStart) s.dev++;
      // River: black presence y>=5, red presence y<=4.
      if ((p.side === 'BLACK' && p.y >= 5) || (p.side === 'RED' && p.y <= 4)) s.river++;
    }
    const mobR = game.generateLegalMoves('RED').length;
    const mobB = game.generateLegalMoves('BLACK').length;
    return `局面要素: 子力 红${stats.RED.mat}:黑${stats.BLACK.mat} | 出动大子 红${stats.RED.dev}:黑${stats.BLACK.dev} | 过河 红${stats.RED.river}:黑${stats.BLACK.river} | 活动度 红${mobR}:黑${mobB}`;
  }

  // Key-point intel for planning: enemy palace defence density and which
  // key files (3/4/5 — the general's file and both ribs) our big pieces sit
  // on or can slide to. Raw materials for attack plans, facts only.
  function intelLine() {
    const defenders = game.currentLivePieceList
      .filter(p => p.side === 'RED' && (p.name === '仕' || p.name === '相'))
      .map(p => p.name).sort().join('') || '无';
    const own = [];
    for (const p of game.currentLivePieceList) {
      if (p.side !== 'BLACK' || (p.name !== '車' && p.name !== '砲')) continue;
      if (p.x === 4) own.push(`${p.name}(${p.x},${p.y})占中路`);
      if (p.x === 3 || p.x === 5) own.push(`${p.name}(${p.x},${p.y})占肋`);
    }
    return `要点情报: 对方将门守备 ${defenders}${defenders.length < 4 ? '(欠固)' : '(完固)'}` +
      (own.length ? ' | ' + own.join(' ') : '');
  }

  function renderObservation() {
    const lines = [];
    lines.push('对局记录:');
    for (let i = 0; i < moves.length; i++) {
      // Black half-moves carry the scratchpad note — written once, immutable.
      const note = i % 2 === 1 && notes[(i - 1) / 2] ? ' — ' + notes[(i - 1) / 2].replace(/\n/g, ' ') : '';
      lines.push(moves[i] + note);
    }
    lines.push('──────────');
    lines.push(`轮到黑方·第 ${moves.length + 2} 手`);
    lines.push(...asciiBoardLines());
    lines.push('你的棋子: ' + sideInventory('BLACK'));
    lines.push('对方棋子: ' + sideInventory('RED'));
    lines.push('FEN: ' + ZhChess.gen_PEN_Str(game.currentLivePieceList, 'BLACK'));
    // Red's immediate capture targets: the anti-hanging signal. Computing
    // this here beats any prompt plea to "watch your pieces". Each entry
    // carries engine-computed RESCUE MOVES as ready-to-copy notation tokens —
    // the model proved unable to translate coordinates into file numbers
    // itself and moved the wrong elephant.
    const blackPieces = game.getPiecesOfSide('BLACK');
    const blackMoves = game.generateLegalMoves('BLACK');
    const threats = [];
    for (const r of game.generateLegalMoves('RED')) {
      if (!r.captured) continue;
      const victim = `${r.captured.name}(${r.captured.x},${r.captured.y})`;
      const hunterName = game.getPiecesOfSide('RED')
        .find(p => p.x === r.from.x && p.y === r.from.y)?.name || '?';
      const savers = blackMoves
        .filter(m => (m.from.x === r.captured.x && m.from.y === r.captured.y) ||
                     (m.to.x === r.from.x && m.to.y === r.from.y))
        .map(m => moveToNotation(m, 'BLACK', blackPieces));
      threats.push(`${victim}被${hunterName}捉,可救着法: ${savers.length ? savers.join(' / ') : '无'}`);
    }
    if (threats.length > 0) {
      lines.push('受威胁的你的棋子:');
      for (const t of threats) lines.push('- ' + t);
    }
    const last = pendingRedToken || moves[moves.length - 1] || '';
    if (last) lines.push('上一步：' + last);
    if (lastCaptured) lines.push('被吃：' + lastCaptured);
    lines.push(intelLine());
    // The active plan sits LATE in the observation: evidence far from the
    // generation end is recalled worse (memory-survey recency bias), and a
    // plan buried under sixty history notes stops steering moves.
    if (lastNote) {
      const planLine = lastNote.split('\n').filter(l => l.includes('【计划】') || l.includes('【进度】')).join(' ');
      if (planLine) lines.push('你当前的计划(自上一手): ' + planLine);
    }
    // Eval BEFORE the list: parseLegalMoves swallows everything after the
    // marker, so annotations must not live inside the list itself.
    lines.push(moveEvalLine());
    lines.push(situationLine());
    lines.push('legal-moves:');
    for (const t of legalNotations('BLACK')) lines.push(t);
    return lines.join('\n');
  }

  // ---- gbot turn ----
  async function postTurn() {
    // A new turn invalidates the previous exchange's bubbles.
    document.getElementById('bubbles').innerHTML = '';
    if (legalNotations('BLACK').length === 0) {
      gameOver = true;
      bubble('gbot', '你赢了，我无路可走了');
      showResult('你赢了');
      return;
    }
    pending = true;
    boardWrap.classList.add('no-click');
    // Streaming bubble: thinking drips into a dimmed line, the note into a
    // normal one, both growing as NDJSON lines arrive over the POST stream.
    const wrap = document.getElementById('bubbles');
    const b = document.createElement('div');
    b.className = 'bubble gbot pending';
    // Fold header mirrors the wui tool-block chevron (same path, rotate-90
    // when open). It stays empty — and hidden via :empty — until the first
    // thinking token arrives.
    const foldIcon = (open) => `<svg class="${open ? 'open' : ''}" width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4.5 3L7.5 6L4.5 9"/></svg>`;
    const thinkFold = document.createElement('div');
    thinkFold.className = 'think-fold';
    const setFold = (open) => {
      thinkFold.innerHTML = foldIcon(open) + '思考';
      thinkDiv.classList.toggle('folded', !open);
    };
    thinkFold.addEventListener('click', () => setFold(thinkDiv.classList.contains('folded')));
    const thinkDiv = document.createElement('div');
    thinkDiv.className = 'think';
    const bodyDiv = document.createElement('div');
    const hintDiv = document.createElement('div');
    hintDiv.textContent = '思考中…';
    b.append(thinkFold, thinkDiv, hintDiv, bodyDiv);
    wrap.appendChild(b);
    wrap.scrollTop = wrap.scrollHeight;
    const scrollBubble = () => { wrap.scrollTop = wrap.scrollHeight; };
    let data = null;
    try {
      const res = await fetch(location.pathname, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: OBSERVE_PROMPT, state: renderObservation() }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = '';
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        let nl;
        while ((nl = buf.indexOf('\n')) >= 0) {
          const line = buf.slice(0, nl).trim();
          buf = buf.slice(nl + 1);
          if (!line) continue;
          const ev = JSON.parse(line);
          if (ev.type === 'thinking') {
            if (thinkDiv.classList.contains('folded') || !thinkFold.firstChild) setFold(true);
            thinkDiv.textContent += ev.text;
            thinkDiv.scrollTop = thinkDiv.scrollHeight;
            hintDiv.remove();
            scrollBubble();
          } else if (ev.type === 'note') {
            // First answer token = thinking is done: fold it away.
            if (thinkDiv.textContent && !thinkDiv.classList.contains('folded')) setFold(false);
            bodyDiv.textContent += ev.text;
            hintDiv.remove();
            scrollBubble();
          } else if (ev.type === 'retry') {
            thinkDiv.textContent = '';
            thinkFold.innerHTML = '';
            bodyDiv.textContent = '';
            hintDiv.textContent = '重想中…';
            b.appendChild(hintDiv);
          } else if (ev.type === 'final') {
            data = ev;
          } else if (ev.type === 'error') {
            throw new Error(ev.message || 'stream error');
          }
        }
      }
      if (!data) throw new Error('stream ended without a move');
      if (data.done || data.move === '认输') {
        b.classList.remove('pending');
        gameOver = true;
        if (!bodyDiv.textContent) bodyDiv.textContent = data.note || '我认输，这局你赢了。';
        showResult('对方认输，你赢了');
        return;
      }
      const move = applyToken(data.move, 'BLACK');
      if (!move) throw new Error('黑方着法非法：' + data.move);
      if (!game.currentLivePieceList.some(p => p.name === '帅')) {
        moves.push(pendingRedToken, data.move);
        notes.push(typeof data.note === 'string' ? data.note : '');
        saveMoves();
        b.classList.remove('pending');
        gameOver = true;
        bubble('user', '你的帅被吃了。');
        showResult('你输了');
        return;
      }
      lastCaptured = move.captured ? move.captured.name : '';
      moves.push(pendingRedToken, data.move);
      notes.push(typeof data.note === 'string' ? data.note : '');
      saveMoves();
      lastNote = typeof data.note === 'string' ? data.note : '';
    } catch (err) {
      b.remove();
      errorBubble(String(err && err.message || err));
      // Keep pending and the click lock: the board waits on red's just-played
      // state until the retry lands.
      return;
    }
    // Nothing streamed (thinking off, empty note): drop the empty shell.
    if (!thinkDiv.textContent && !bodyDiv.textContent) b.remove();
    b.classList.remove('pending');
    pending = false;
    boardWrap.classList.remove('no-click');
    renderBoard();
    if (game.isGameOver() || legalNotations('RED').length === 0) {
      gameOver = true;
      bubble('gbot', '我赢了，承让~');
      showResult('你输了');
    }
  }

  // ---- restore ----
  function restore() {
    const saved = loadSave();
    if (!saved) {
      // Drop structurally corrupt saves in place — keeping them only re-fails
      // the parse on every load.
      if (localStorage.getItem(saveKey()) !== null) discardSave();
      return false;
    }
    for (let i = 0; i < saved.moves.length; i++) {
      const side = i % 2 === 0 ? 'RED' : 'BLACK';
      if (!applyToken(saved.moves[i], side)) {
        // Replay failing midway means the save disagrees with the rules engine;
        // discard and start fresh.
        discardSave();
        game.gameStart('RED');
        moves = [];
        notes = [];
        return false;
      }
    }
    moves = saved.moves;
    notes = saved.notes;
    return true;
  }

  function init() {
    restore();
    renderBoard();
  }

  // ---- bubbles ----
  function bubble(who, text, sticky) {
    const wrap = document.getElementById('bubbles');
    const b = document.createElement('div');
    b.className = 'bubble ' + who + (sticky ? ' pending' : '');
    if (who !== 'gbot') {
      const whoDiv = document.createElement('div');
      whoDiv.className = 'who';
      whoDiv.textContent = '你';
      b.appendChild(whoDiv);
    }
    const bodyDiv = document.createElement('div');
    bodyDiv.textContent = text;
    b.appendChild(bodyDiv);
    wrap.appendChild(b);
    wrap.scrollTop = wrap.scrollHeight;
    return b;
  }

  function errorBubble(msg) {
    const wrap = document.getElementById('bubbles');
    const b = document.createElement('div');
    b.className = 'bubble gbot error';
    const bodyDiv = document.createElement('div');
    bodyDiv.textContent = '出错了：' + msg;
    const retry = document.createElement('button');
    retry.className = 'retry-btn';
    retry.textContent = '重试';
    retry.addEventListener('click', () => {
      b.remove();
      postTurn();
    });
    b.append(bodyDiv, retry);
    wrap.appendChild(b);
  }

  // ---- game over ----
  function showResult(text) {
    gameOver = true;
    pending = false;
    boardWrap.classList.add('no-click');
    const banner = document.getElementById('resultBanner');
    document.getElementById('resultText').textContent = text;
    // Win = warm accent, loss = muted — a fact tint, not decoration.
    banner.style.setProperty('--result-accent',
      text.includes('赢') ? 'var(--piece-red-bg)' : 'var(--grid-line)');
    banner.style.display = 'flex';
  }
  // Two-step resign (chess-UI convention: flag icon + confirm, so a stray
  // tap never ends the game). First tap arms for 3s, second tap resigns.
  let resignArmed = null;
  function resign() {
    if (gameOver) return;
    const btn = document.getElementById('resignBtn');
    if (resignArmed) {
      clearTimeout(resignArmed);
      resignArmed = null;
      btn.classList.remove('confirm');
      btn.textContent = '🏳';
      showResult('你认输了，这局对方赢');
      bubble('gbot', '承让~');
      return;
    }
    btn.classList.add('confirm');
    btn.textContent = '?';
    resignArmed = setTimeout(() => {
      resignArmed = null;
      btn.classList.remove('confirm');
      btn.textContent = '🏳';
    }, 3000);
  }
  function newGame() {
    checkSide = null;
    if (resignArmed) { clearTimeout(resignArmed); resignArmed = null;
      const b = document.getElementById('resignBtn'); b.classList.remove('confirm'); b.textContent = '🏳'; }
    moves = [];
    notes = [];
    pendingRedToken = '';
    lastNote = '';
    lastCaptured = '';
    selected = null;
    gameOver = false;
    pending = false;
    localStorage.removeItem(saveKey());
    game.gameStart('RED');
    document.getElementById('resultBanner').style.display = 'none';
    boardWrap.classList.remove('no-click');
    renderBoard();
    document.getElementById('bubbles').innerHTML = '';
    bubble('user', '新局开始，你执红先行。');
  }

  // Theme follows the host wui page: the iframe is same-origin sandboxed, so
  // the board can read the host root's data-theme and observe its changes.
  // Local toggle still works for a standalone open.
  function syncThemeFromHost() {
    try {
      const host = window.parent && window.parent.document.documentElement;
      const t = host && host.dataset.theme;
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) { /* cross-origin (standalone open): keep local theme */ }
  }
  try {
    new MutationObserver(syncThemeFromHost).observe(
      window.parent.document.documentElement,
      { attributes: true, attributeFilter: ['data-theme'] });
  } catch (e) { /* standalone open: no host to observe */ }
  syncThemeFromHost();

  window.ChessGame = {
    _testSetPen: (pen) => { game.setPenCodeList(pen); renderBoard(); },
    _testGameState: () => game.gameState,
    init, restore, renderBoard, renderObservation,
    moveToNotation, legalNotations, applyToken, onCellClick, postTurn,
    showResult, resign, newGame,
  };
  init();
})();
</script>
